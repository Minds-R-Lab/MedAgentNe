name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regression tests
        working-directory: medagentnet
        run: python -m pytest tests -q

      - name: End-to-end harness run (deterministic backend)
        working-directory: medagentnet
        run: |
          python run_r1.py --provider mock --patients 80 --tag ci \
                 --experiments e9 e1 e4 e5 --quiet

      - name: Check the headline architectural results still hold
        working-directory: medagentnet
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("data/results_r1/latest.json"))
          full = d["e4"]["rows"]["medagentnet"]["f1"]["mean"]
          abl  = d["e4"]["rows"]["ablate_synthesis"]["f1"]["mean"]
          leak = d["e9"]["r1_construction"]
          fails = []
          if full < 0.85:
              fails.append(f"full-system F1 regressed to {full}")
          if abl > full / 2:
              fails.append(f"removing assembly no longer collapses detection "
                           f"({abl} vs {full})")
          if leak["mean_disallowed_keys"] != 0:
              fails.append("a disallowed field reappeared in the query context")
          if leak["contexts_carrying_ground_truth"] != 0:
              fails.append("ground-truth text reappeared in the query context")
          for f in fails:
              print("FAIL:", f)
          sys.exit(1 if fails else 0)
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-py${{ matrix.python-version }}
          path: medagentnet/data/results_r1/latest.json
          if-no-files-found: warn
