[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medagentnet"
version = "1.0.0"
description = "Federated multi-agent architecture for privacy-preserving cross-departmental clinical reasoning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Mohamed Mabrok", email = "m.a.mabrok@qu.edu.qa" },
  { name = "Yalda Zafari" },
  { name = "Yang Cao" },
  { name = "Naoto Yanai" },
  { name = "Essam A. Rashed" },
]
keywords = ["agentic-ai", "multi-agent", "federated-inference",
            "clinical-decision-support", "privacy", "consent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["pyyaml>=6.0", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
hf = ["transformers>=4.40", "torch>=2.2", "bitsandbytes>=0.43"]

[project.urls]
Repository = "https://github.com/Minds-R-Lab/MedAgentNet"

[tool.pytest.ini_options]
testpaths = ["medagentnet/tests"]
